name: smartparkapp
description: "Smart Park - Your spot found easily."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.1.0
  flutter_map: ^6.1.0
  geolocator: ^10.0.0
  geocoding: ^3.0.0
  razorpay_flutter: ^1.3.5
  socket_io_client: ^2.0.3+1
  image_picker: ^1.2.1
  url_launcher: ^6.2.6
  latlong2: ^0.9.0
  google_maps_flutter: ^2.17.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/smartpark_logocar_zoomed.jpeg"
  image_path_ios: "assets/smartpark_logocar_zoomed.jpeg"
  android: true
  ios: true
  android_adaptive_icon_background: "#ffffff"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
